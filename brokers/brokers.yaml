# Broker definitions for real brokers.
#
# DRAFT FORMAT, UNREVIEWED DATA. See README.md in this directory.
#
# This file is a multi-document YAML stream. Each document is one broker definition with the
# fields of example.yaml. Comments hold source notes for the review. Parsers ignore them.
#
# Generated on 2026-10-05 from two sources:
#   1. Big Ass Data Broker Opt-Out List (BADBOOL) by Yael Grauer, updated 2026-09-27.
#      https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List
#      BADBOOL is licensed CC BY-NC-SA. Section 1 adapts its entries and notes, and is shared
#      under the same license.
#   2. California data broker registry, 2026 edition, last updated 2026-07-29.
#      https://cppa.ca.gov/data_broker_registry/registry.csv
#      Used only as a public list of brokers.
#
# Conventions:
#   - No entry has been reviewed by hand. last_verified is null on every entry. Proposed rule:
#     an entry with a null last_verified is an unreviewed draft and is never used.
#   - null means the sources do not give the value. recheck_days is null on every entry
#     because neither source gives one.
#   - search_url: none in section 2 means neither source names a public search. It was not
#     checked against the site. Under the verify-first rule these brokers get an access
#     request first.
#   - A search_url marked TODO is a search page or site root, not a query pattern.
#   - webform entries hold only the open step from the source. The fill, click and wait_for
#     steps must be written by hand against the live page.
#   - jurisdiction is the ISO 3166-1 alpha-2 code of the country in the registered address.
#     CA is Canada, not California. It is null for brokers that are not in the registry.
#   - channel follows the source: manual when it requires an ID upload, a phone call, a paid
#     or account step, or CAPTCHAs; email when it names an email route, and for every
#     registry-only broker; webform otherwise.
#   - Registry contacts that are California DROP mailboxes are left null. The bot never uses
#     DROP.
#   - Registry "collects" and "shared or sold" notes repeat the broker's own registry answers.

# ============================================================================================
# Section 1. People-search sites from BADBOOL, in BADBOOL priority order.
# ============================================================================================
